services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-fittodoey}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-fittodoey}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:-fittodoey}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DJANGO_MUSIC_ROOT: /music
    volumes:
      - backend_data:/data
      - ./music:/music
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: fittodoey
      POSTGRES_USER: fittodoey
      POSTGRES_PASSWORD: fittodoey
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  backend_data:
  postgres_data:
