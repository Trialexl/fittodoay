services:
  backend:
    image: fittodoay-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-256m}
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-128m}
    pids_limit: ${BACKEND_PIDS_LIMIT:-96}
    env_file:
      - backend/.env
    environment:
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-fittodoey}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-fittodoey}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:-fittodoey}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DJANGO_MEDIA_ROOT: /data/media
      DJANGO_MUSIC_ROOT: /music
      DJANGO_TECHNIQUE_ANALYSIS_MODE: ${DJANGO_TECHNIQUE_ANALYSIS_MODE:-async}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-1}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-200}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-30}
    volumes:
      - backend_data:/data
      - ./music:/music
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  technique-worker:
    image: fittodoay-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-256m}
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-128m}
    pids_limit: ${BACKEND_PIDS_LIMIT:-96}
    env_file:
      - backend/.env
    environment:
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-fittodoey}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-fittodoey}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:-fittodoey}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DJANGO_MEDIA_ROOT: /data/media
      DJANGO_MUSIC_ROOT: /music
      DJANGO_TECHNIQUE_ANALYSIS_MODE: async
    volumes:
      - backend_data:/data
      - ./music:/music
    command: ["python", "manage.py", "process_technique_reviews"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_OPTIONS: ${FRONTEND_NODE_OPTIONS:---max-old-space-size=128}
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-192m}
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-96m}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-96}
    env_file:
      - frontend/.env
    environment:
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-change-me-to-a-stable-32-byte-base64-key}
      NODE_OPTIONS: ${FRONTEND_NODE_OPTIONS:---max-old-space-size=128}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT:-256m}
    mem_reservation: ${DB_MEMORY_RESERVATION:-128m}
    pids_limit: ${DB_PIDS_LIMIT:-96}
    environment:
      POSTGRES_DB: fittodoey
      POSTGRES_USER: fittodoey
      POSTGRES_PASSWORD: fittodoey
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

volumes:
  backend_data:
  postgres_data:
