[tool.black]
line-length = 88
target-version = ["py311"]
exclude = ["backend/migrations"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fittodoey_backend.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["."]
